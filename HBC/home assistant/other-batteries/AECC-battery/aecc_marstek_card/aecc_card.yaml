                    if (charging && pct < 100) {
                      const solid = Math.max(0, Math.ceil(pct / 20) - 1);
                      for (let i = 0; i < solid; i++) seg[i] = 'on';
                      seg[solid] = 'f1';
                    } else if (pct >= 100) {
