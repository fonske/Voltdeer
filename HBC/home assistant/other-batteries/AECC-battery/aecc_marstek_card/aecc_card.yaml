type: horizontal-stack
cards:
  - type: picture-elements
    image:
      media_content_id: media-source://media_source/local/sr5000_pro_dark.png
      media_content_type: image/png
    elements:
      - type: custom:button-card
        entity: sensor.aecc_battery_battery_soc
        triggers_update:
          - sensor.marstek_m1_ac_power
        show_name: false
        show_icon: false
        show_state: false
        show_label: false
        tap_action:
          action: none
        hold_action:
          action: none
        styles:
          card:
            - width: 24px
            - height: 3px
            - min-height: 3px
            - padding: 0
            - margin: 0
            - border: none
            - border-radius: 3px 0 0 3px
            - transition: background 0.6s ease
            - background: |
                [[[
                  // ---- CONFIG (identical in every segment) ----
                  // If your power sensor is negative while charging, set
                  // POWER_POSITIVE_IS_CHARGING = false.
                  const CHARGE_ENTITY = 'sensor.marstek_m1_ac_power';     // W, positive = charging
                  const POWER_POSITIVE_IS_CHARGING = true;
                  const POWER_DEADBAND_W = 20;
                  const CHARGING_STATES = ['on', 'charging', 'charge'];
                  const FAULT_ENTITY = '';
                  const FAULT_STATES = ['on', 'fault', 'error', 'problem'];
                  const ICE_BLUE = '79,195,247';
                  const RED = '244,67,54';
                  const OFF = '#2a2a2a';
                  const IDX = 0;                      // this segment, 0..4
                  // ---------------------------------------------
                  const soc = parseFloat(entity ? entity.state : 'x');
                  const seg = ['off','off','off','off','off'];
                  let rgb = ICE_BLUE;
                  const fst = FAULT_ENTITY && states[FAULT_ENTITY] ? states[FAULT_ENTITY].state : undefined;
                  if (fst !== undefined && FAULT_STATES.includes(String(fst).toLowerCase())) {
                    rgb = RED; seg.fill('on');
                  } else if (!isNaN(soc)) {
                    let charging = false;
                    const cst = CHARGE_ENTITY && states[CHARGE_ENTITY] ? states[CHARGE_ENTITY].state : undefined;
                    if (cst !== undefined) {
                      const w = parseFloat(cst);
                      if (!isNaN(w)) charging = POWER_POSITIVE_IS_CHARGING ? w > POWER_DEADBAND_W : w < -POWER_DEADBAND_W;
                      else charging = CHARGING_STATES.includes(String(cst).toLowerCase());
                    }
                    const pct = Math.max(0, Math.min(100, soc));
                    if (charging && pct < 100) {
                      const solid = Math.max(0, Math.ceil(pct / 20) - 1);
                      for (let i = 0; i < solid; i++) seg[i] = 'on';
                      seg[solid] = 'f1';
                    } else if (pct >= 100) {
                      seg.fill('on');
                    } else if (pct <= 10) {
                      seg[0] = 'f4';
                    } else {
                      const solid = Math.max(1, Math.ceil(pct / 20));
                      for (let i = 0; i < solid; i++) seg[i] = 'on';
                    }
                  }
                  const s = seg[IDX];
                  const lit = s !== 'off';
                  return lit ? 'rgb(' + rgb + ')' : OFF;
                ]]]
            - box-shadow: |
                [[[
