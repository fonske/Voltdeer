select:
  - platform: template
    name: "Work Mode"
    id: working_mode
    icon: mdi:battery-sync-outline
    options:
      - "Self-Consumption (AI)"
      - "Custom / Manual"
    initial_option: "Self-Consumption (AI)"
    optimistic: true
    restore_value: true        # after a reboot, Custom / Manual is re-applied by on_boot
    set_action:
      - if:
          condition:
            lambda: 'return x == "Custom / Manual";'
          then:
            - script.execute: ems_take_control
          else:
            - number.set:
                id: battery_power_target
                value: 0
            - script.execute: ems_self_consumption
    web_server:
      sorting_group_id: Control
      sorting_weight: 0

