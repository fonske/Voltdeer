      "Rvtran": 15
      "YUZE": 16
      "EVT": 17
      "Factory protocol 18 (this unit)": 18   # read from this battery; not in the makstech list (0-17)
      "Unknown": 65535
    lambda: |-
      if (x >= 0 && x <= 18) return {};   // known value: use optionsmap
      ESP_LOGW("select", "BMS Protocol: register holds unknown value %lld", (long long) x);
      return std::string("Unknown");
    write_lambda: |-
      if (x == "Unknown") return {};       // never write the placeholder back
      return value;
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 29

  ## Netherlands normally uses EN50549
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Grid Standard"
    id: grid_standard
    icon: mdi:certificate
    address: 0xA043        # gridStandardSet
    value_type: U_WORD
    entity_category: config
    disabled_by_default: true
    optionsmap:
      "GNL": 0
      "VDE4105": 1
      "IEEE1547": 2
      "CEI-021": 3
      "VDE0126": 4
      "EN50549 (General)": 5
      "EN50549-SE (Switzerland)": 6
      "EN50549-DK1 (Denmark)": 7
      "SI4777 (Israel)": 8
      "TOR-Z1 (Austria)": 9
      "EN50549-PL (Poland)": 10
      "Unknown": 65535
    lambda: |-
      if (x >= 0 && x <= 10) return {};   // known value: use optionsmap
      ESP_LOGW("select", "Grid Standard: register holds unknown value %lld", (long long) x);
      return std::string("Unknown");
    write_lambda: |-
      if (x == "Unknown") return {};       // never write the placeholder back
      return value;
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 30

###############################################################################
## JSON API CLIENT (energy manager on ${aecc_ip}:${aecc_port})
###############################################################################
globals:
  - id: ems_state            # 0 idle, 1 request running in background task, 2 reply ready
    type: std::atomic<int>
  - id: ems_serial
    type: int
    initial_value: '0'
  - id: ems_reply
    type: std::string
  - id: ems_error_count
    type: int
    initial_value: '0'
  - id: desired_power        # W, target after SOC limits, as written to 0xFE16
    type: int
    initial_value: '0'
  - id: desired_since_ms
    type: uint32_t
    initial_value: '0'
  - id: slot_power_sent      # W in slot 3003 confirmed by the battery (99999 = unknown)
    type: int
    initial_value: '99999'
  - id: slot_power_pending   # W in a slot write awaiting its reply (99999 = none)
    type: int
    initial_value: '99999'
  - id: last_slot_send_ms
    type: uint32_t
    initial_value: '0'
  - id: setpoint_fallbacks   # consecutive readings where 0xFE16 did not hold the target
    type: int
    initial_value: '0'
  - id: last_takeover_ms     # last time the energy manager setup was re-sent by the watchdog
    type: uint32_t
    initial_value: '0'

script:
  ## Enable the energy manager in custom mode. Slot 3003 carries the current target (as in
  ## StekkerDeal/aecc-battery-local), so the battery's own fallback command equals the target.
  ## 0 W -> idle slot (as StekkerDeal): the battery holds 0 W. 3026/3029 (base discharge) are forced
  ## off: positive values export unconditionally.
  - id: ems_take_control
    mode: restart
    then:
      - script.execute:
          id: ems_send
          body: !lambda |-
            int w = id(desired_power);
            int min_soc = (std::isnan(id(discharge_limit).state) ? ${ems_min_soc} : (int) lroundf(id(discharge_limit).state));
            int max_soc = (std::isnan(id(charge_limit).state) ? ${ems_max_soc} : (int) lroundf(id(charge_limit).state));
            char slot[64];
            if (w == 0)
              snprintf(slot, sizeof(slot), "0,00:00,00:00,0,0,0,0,0,0,%d,%d", max_soc, min_soc);
            else
              snprintf(slot, sizeof(slot), "1,00:00,23:59,%d,0,6,5,0,0,%d,%d", w, max_soc, min_soc);
            id(slot_power_pending) = w;
            id(last_slot_send_ms) = millis();
            float mc = id(max_charge_power).state, md = id(max_discharge_power).state;
            int cap = (int) lroundf(std::max(std::isnan(mc) ? ${ems_max_charge}.0f : mc,
                                             std::isnan(md) ? ${ems_max_discharge}.0f : md));
            char extra[96];
            snprintf(extra, sizeof(extra), "\"3023\":\"%d\",\"3024\":\"%d\",\"3039\":\"%d\",",
                     min_soc, max_soc, cap);
            return std::string("\"Set\":\"Energycontrolparameters\",\"SetControlInfo\":{"
                               "\"3000\":\"1\",\"3020\":\"6\",\"3021\":\"0\",\"3022\":\"0\","
                               "\"3026\":\"0\",\"3029\":\"0\",\"3030\":\"1\",") + extra + "\"3003\":\"" + slot + "\"}";

  ## A SOC limit changed: send it to the battery (not during the first 30 s, when values are restored at boot).
  ## Custom / Manual: force the slot interval to re-send the setup. Self-Consumption: re-send that mode.
  ## Waits 3 s so moving the slider sends only the final value.
  - id: soc_limits_changed
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: 'return millis() > 30000;'
          then:
            - if:
                condition:
                  select.is:
                    id: working_mode
                    options: "Custom / Manual"
                then:
                  - lambda: 'id(slot_power_sent) = 99999;'
                else:
                  - script.execute: ems_self_consumption

  ## Hand the battery back to its own self-consumption AI (registers as in StekkerDeal/aecc-battery-local).
  ## The cleared slot 3003 stops the firmware executing the old manual command.
  - id: ems_self_consumption
    mode: restart
    then:
      - script.execute:
          id: ems_send
          body: !lambda |-
            int min_soc = (std::isnan(id(discharge_limit).state) ? ${ems_min_soc} : (int) lroundf(id(discharge_limit).state));
            int max_soc = (std::isnan(id(charge_limit).state) ? ${ems_max_soc} : (int) lroundf(id(charge_limit).state));
            char buf[256];
            snprintf(buf, sizeof(buf),
                     "\"Set\":\"Energycontrolparameters\",\"SetControlInfo\":{\"3000\":\"1\",\"3020\":\"3\","
                     "\"3021\":\"1\",\"3022\":\"1\",\"3030\":\"0\",\"3023\":\"%d\",\"3024\":\"%d\","
                     "\"3003\":\"0,00:00,00:00,0,0,0,0,0,0,%d,%d\"}",
                     min_soc, max_soc, max_soc, min_soc);
            return std::string(buf);

  ## Sends one newline-terminated JSON request in a background FreeRTOS task (never blocks the main loop).
  ## Requests are queued; one at a time, since the datalogger only serves one client.
  - id: ems_send
    mode: queued
    max_runs: 5
    parameters:
      body: string
    then:
      - wait_until:
          condition:
            lambda: 'return id(ems_state).load() == 0;'
          timeout: 60s             # a request can take up to 3 x 10 s
      - lambda: |-
          if (id(ems_state).load() != 0) {
            ESP_LOGW("ems", "previous JSON request still running, request dropped");
            return;
          }
          id(ems_state).store(1);
          auto *req = new std::string("{" + body + ",\"SerialNumber\":" +
                                      std::to_string(++id(ems_serial)) + ",\"CommandSource\":\"HA\"}\n");
          ESP_LOGI("ems", "-> %s", req->c_str());
          auto task = [](void *arg) {
            std::string *rq = static_cast<std::string *>(arg);
            std::string reply;
            // The battery's WiFi module sometimes does not answer (busy / slow WiFi):
            // try up to 3 times, 2 s apart, before reporting an error.
            for (int attempt = 1; attempt <= 3; attempt++) {
              reply.clear();
              int fd = ::socket(AF_INET, SOCK_STREAM, 0);
              if (fd < 0) {
                reply = "ERROR: no socket";
              } else {
                struct sockaddr_in addr {};
                addr.sin_family = AF_INET;
                addr.sin_port = htons(${aecc_port});
                if (::inet_pton(AF_INET, "${aecc_ip}", &addr.sin_addr) != 1) {
                  reply = "ERROR: invalid aecc_ip '${aecc_ip}'";
                  ::close(fd);
                  break;   // retrying will not help
                }
                // non-blocking connect with a 3 s timeout
                ::fcntl(fd, F_SETFL, ::fcntl(fd, F_GETFL, 0) | O_NONBLOCK);
                int rc = ::connect(fd, (struct sockaddr *) &addr, sizeof(addr));
                bool connected = (rc == 0);
                if (!connected && errno == EINPROGRESS) {
                  fd_set wset; FD_ZERO(&wset); FD_SET(fd, &wset);
                  struct timeval tv {3, 0};
                  if (::select(fd + 1, nullptr, &wset, nullptr, &tv) > 0) {
                    int err = 0; socklen_t len = sizeof(err);
                    ::getsockopt(fd, SOL_SOCKET, SO_ERROR, &err, &len);
                    connected = (err == 0);
                  }
                }
                if (!connected) {
                  reply = "ERROR: cannot connect to ${aecc_ip}:${aecc_port}";
                } else {
                  ::fcntl(fd, F_SETFL, ::fcntl(fd, F_GETFL, 0) & ~O_NONBLOCK);
                  struct timeval to {1, 0};   // poll in 1 s steps, up to the 10 s reply window
                  ::setsockopt(fd, SOL_SOCKET, SO_RCVTIMEO, &to, sizeof(to));
                  ::setsockopt(fd, SOL_SOCKET, SO_SNDTIMEO, &to, sizeof(to));
                  if (::send(fd, rq->data(), rq->size(), 0) != (int) rq->size()) {
                    reply = "ERROR: send failed";
                  } else {
                    // Read until one complete JSON object has arrived: replies can span several
                    // lines (StekkerDeal/aecc-battery-local), and the module can take up to ~10 s.
                    char buf[512];
                    int depth = 0; bool started = false, in_str = false, esc = false, done = false;
                    TickType_t deadline = xTaskGetTickCount() + pdMS_TO_TICKS(10000);
                    while (!done && reply.size() < 8192 && (int32_t) (deadline - xTaskGetTickCount()) > 0) {
                      int n = ::recv(fd, buf, sizeof(buf), 0);
                      if (n == 0) break;                                    // connection closed
                      if (n < 0) { if (errno == EAGAIN || errno == EWOULDBLOCK) continue; break; }
                      for (int i = 0; i < n && !done; i++) {
                        char c = buf[i];
                        reply += c;
                        if (in_str) { if (esc) esc = false; else if (c == '\\') esc = true; else if (c == '"') in_str = false; }
                        else if (c == '"') in_str = true;
                        else if (c == '{') { depth++; started = true; }
                        else if (c == '}' && started && --depth == 0) done = true;
                      }
                    }
                    if (reply.empty())
                      reply = "ERROR: no reply";
                    else if (!done)
                      reply = "ERROR: incomplete reply: " + reply.substr(0, 120);
                  }
                }
                ::close(fd);
              }
              if (reply.rfind("ERROR", 0) != 0) break;   // got an answer
              if (attempt < 3) vTaskDelay(pdMS_TO_TICKS(2000));
              else reply += " (after 3 attempts)";
            }
            while (!reply.empty() && (reply.back() == '\n' || reply.back() == '\r'))
              reply.pop_back();
            id(ems_reply) = reply;
            id(ems_state).store(2);   // hand the reply to the main loop
            delete rq;
            vTaskDelete(nullptr);
          };
          if (xTaskCreate(task, "aecc_ems", 6144, req, 1, nullptr) != pdPASS) {
            delete req;
            id(ems_state).store(0);
            ESP_LOGW("ems", "could not start JSON task");
          }

  ## knop op de atom ingedrukt houden = veranderen brightness
  - id: adjust_brightness_loop
    mode: restart
    then:
      - repeat:
          count: 1000
          then:
            - lambda: |-
                static float brightness = 0.0;
                brightness += 0.1;
                if (brightness > 1.0) brightness = 0.0;
                auto call = id(status_led).make_call();
                call.set_brightness(brightness);
                call.perform();
            - delay: 750ms

###############################################################################
## STATUS LED
###############################################################################
## Simple status led for Atom s3 (lite)
## G35=RGB WS2812C-2020
light:
  - name: "Status led"
    id: status_led
    icon: mdi:lightbulb
    platform: esp32_rmt_led_strip
    internal: true # Hides from Home Assistant
    channel_colors: GRB
    pin: 35
    num_leds: 1   # the AtomS3 Lite has a single LED
    chipset: ws2812
#    rmt_channel: 0 #only on platform: arduino
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic
    effects:
      - pulse:
          name: slow_pulse
          transition_length: 250ms
          update_interval: 500ms
          min_brightness: 10%
          max_brightness: 50%
      - pulse:
          name: fast_pulse
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 25%
          max_brightness: 100%
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 13

# 🟢 Green on => wifi connected- api connected/ Green blinking => wifi connected - api disconnected
# 🟣 Purple => wifi disconnected
# 🔵 Blue => AP mode

interval:
  ## Power control loop: write the target to 0xFE16 every second in Custom / Manual mode.
  - interval: 1s
    then:
      - if:
          condition:
            select.is:
              id: working_mode
              options: "Custom / Manual"
          then:
            - lambda: |-
                float target = -id(battery_power_target).state;   // Power Setpoint is + = charge; register + = discharge
                if (std::isnan(target)) target = 0;
                float soc = id(battery_state_of_charge).state;
                if (!std::isnan(soc)) {
                  if (target > 0 && soc <= (std::isnan(id(discharge_limit).state) ? ${ems_min_soc} : (int) lroundf(id(discharge_limit).state))) target = 0;   // Discharge Limit reached: no discharge
                  if (target < 0 && soc >= (std::isnan(id(charge_limit).state) ? ${ems_max_soc} : (int) lroundf(id(charge_limit).state))) target = 0;   // Charge Limit reached: no charge
                }
                float max_dis = id(max_discharge_power).state, max_chg = id(max_charge_power).state;
                if (!std::isnan(max_dis) && target > max_dis) target = max_dis;      // discharge limit
                if (!std::isnan(max_chg) && target < -max_chg) target = -max_chg;    // charge limit
                int w = (int) lroundf(target);
                if (w != id(desired_power)) {
                  id(desired_power) = w;
                  id(desired_since_ms) = millis();
                }
                auto call = id(setpoint_writer).make_call();   // writes 0xFE16 (FC6)
                call.set_value(w);
                call.perform();

  ## Keep schedule slot 3003 (what the battery runs when a 0xFE16 write is missed) equal to the
  ## target, so a missed write no longer changes the battery power. Updated over JSON once the
  ## target has been stable for 2 s, at most every ${ems_slot_min_interval} s.
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - select.is:
                  id: working_mode
                  options: "Custom / Manual"
              - lambda: |-
                  return id(ems_state).load() == 0 &&
                         id(slot_power_pending) == 99999 &&
                         id(desired_power) != id(slot_power_sent) &&
                         millis() - id(desired_since_ms) > 2000 &&
                         millis() - id(last_slot_send_ms) > ${ems_slot_min_interval} * 1000UL;
          then:
            - script.execute: ems_take_control

  ## Reassert the energy manager setup (the vendor app's AI mode rewrites it).
  - interval: 5min
    then:
      - if:
          condition:
            select.is:
              id: working_mode
              options: "Custom / Manual"
          then:
            - script.execute: ems_take_control

  ## Publish JSON replies from the background task (on the main loop, where it is safe).
  - interval: 250ms
    then:
      - lambda: |-
          if (id(ems_state).load() == 2) {
            std::string r = id(ems_reply);
            id(ems_state).store(0);
            if (id(slot_power_pending) != 99999) {
              bool ok = r.rfind("ERROR", 0) != 0 && r.find("SetParameters") != std::string::npos &&
                        r.find("fail") == std::string::npos && r.find("rror") == std::string::npos;
              if (ok) {
                id(slot_power_sent) = id(slot_power_pending);
                ESP_LOGI("ems", "slot 3003 now %d W", id(slot_power_sent));
              } else {
                id(slot_power_sent) = 99999;   // unknown: retried by the slot interval
              }
              id(slot_power_pending) = 99999;
            }
            if (r.rfind("ERROR", 0) == 0) {
              // keep showing the last good reply; only log + count the failure
              ESP_LOGW("ems", "<- %s", r.c_str());
              id(ems_error_count) += 1;
              id(ems_errors).publish_state(id(ems_error_count));
              return;
            }
            ESP_LOGI("ems", "<- %s", r.c_str());
            if (r.size() > 250) r = r.substr(0, 247) + "...";
            id(ems_reply_text).publish_state(r);
          }

  - interval: 10s
    then:
      if:
        condition:
          wifi.connected:
        then:
          if:
            condition:
              api.connected:
            then:
              - light.turn_on:
                  id: status_led
                  brightness: 50%
                  red: 0
                  green: 100%
                  blue: 0
                  effect: None
            else:
              - light.turn_on:
                  id: status_led
                  brightness: 50%
                  red: 0
                  green: 100%
                  blue: 0
                  effect: slow_pulse              
        else:
          if:
            condition:
              - lambda: 'return id(id_captive_portal).is_active();'
            then:
              - light.turn_on:
                  id: status_led
                  brightness: 100%
                  red: 0
                  green: 0
                  blue: 100%
            else:
              - light.turn_on:
                  id: status_led
                  brightness: 100%
                  red: 100%
                  green: 0
                  blue: 0