###############################################################################
## AECC SETTINGS (registers 0xA028-0xA0AF, 0x9C40, 0x9ACE)
## Polled every 5 minutes via modbus_controller mt_slow. Only FC6 single-register writes are used.
## Entities marked disabled_by_default can break things: enable them in HA only if you know why.
###############################################################################
number:
## Power Setpoint (StekkerDeal convention): positive = charge, negative = discharge, 0 = idle.
## While Work Mode is "Custom / Manual", it is written (sign-flipped) to 0xFE16 every second.
  - platform: template
    name: "Power Setpoint"
    id: battery_power_target
    icon: mdi:battery-sync-outline
    unit_of_measurement: "W"
    device_class: power
    mode: box
    min_value: -${ems_max_discharge}
    max_value: ${ems_max_charge}
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: false     # always start at 0 W after a reboot
    web_server:
      sorting_group_id: Control
      sorting_weight: 1

## Internal writer for 0xFE16: the 1 s control loop sets this number, and the number writes
## the register (ESPHome's own write path). Polled only with the settings (every 10 min).
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Setpoint Writer"
    id: setpoint_writer
    internal: true
    register_type: holding
    address: 0xFE16        # register convention: + = discharge, - = charge
    value_type: S_WORD
    min_value: -10000
    max_value: 10000
    step: 1

## Adjustable power limits. The Power Setpoint is clamped to these, and the battery's own
## local power cap (3039) is set to the larger of the two. Kept across reboots.
  - platform: template
    name: "Max Charge Power"
    id: max_charge_power
    icon: mdi:battery-arrow-up
    unit_of_measurement: "W"
    device_class: power
    mode: box
    min_value: 0
    max_value: ${ems_max_charge}
    step: 50
    initial_value: ${ems_max_charge}
    optimistic: true
    restore_value: true
    on_value:
      - lambda: 'id(slot_power_sent) = 99999;'   # re-send the energy manager setup (new 3039) in Custom / Manual
    web_server:
      sorting_group_id: Control
      sorting_weight: 2

  - platform: template
    name: "Max Discharge Power"
    id: max_discharge_power
    icon: mdi:battery-arrow-down
    unit_of_measurement: "W"
    device_class: power
    mode: box
    min_value: 0
    max_value: ${ems_max_discharge}
    step: 50
    initial_value: ${ems_max_discharge}
    optimistic: true
    restore_value: true
    on_value:
      - lambda: 'id(slot_power_sent) = 99999;'
    web_server:
      sorting_group_id: Control
      sorting_weight: 3

## Adjustable SOC limits (as StekkerDeal's Charge Limit / Discharge Limit). Written to the battery
## as 3023/3024 and inside slot 3003 (the battery enforces the ones in the slot), and used by the
## ESP to stop charging/discharging. Kept across reboots.
  - platform: template
    name: "Charge Limit"
    id: charge_limit
    icon: mdi:battery-arrow-up
    unit_of_measurement: "%"
    device_class: battery
    mode: slider
    min_value: 50
    max_value: 100
    step: 5
    initial_value: ${ems_max_soc}
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: soc_limits_changed
    web_server:
      sorting_group_id: Control
      sorting_weight: 4

  - platform: template
    name: "Discharge Limit"
    id: discharge_limit
    icon: mdi:battery-arrow-down
    unit_of_measurement: "%"
    device_class: battery
    mode: slider
    min_value: 5
    max_value: 50
    step: 5
    initial_value: ${ems_min_soc}
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: soc_limits_changed
    web_server:
      sorting_group_id: Control
      sorting_weight: 5

## Grid-tie (on-grid output) power cap. Lives in THREE places: 0xA03F, mirror 0x9ACE and EMS 3039
## (JSON API only). Output tops out at the lowest of them. This writes both Modbus copies.
## Note: it caps total on-grid output (incl. your own load), so it is not a pure export limit.
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Grid Tie Power Cap"
    id: grid_export_limit
    icon: mdi:transmission-tower-export
    register_type: holding
    address: 0xA03F        # onGridActivePowerSet
    value_type: U_WORD
    unit_of_measurement: "W"
    entity_category: config
    mode: box
    min_value: 0
    max_value: 2500        # adjust to your unit's rating
    step: 1
    write_lambda: |-
      // write both copies through this entity's own write helper (FC6)
      item->write_single_register(0xA03F, (uint16_t) x);
      item->write_single_register(0x9ACE, (uint16_t) x);   // mirror copy
      return {};   // already sent above
    web_server:
      sorting_group_id: Settings
      sorting_weight: 0

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Constant Voltage"
    id: cv_voltage
    icon: mdi:flash
    register_type: holding
    address: 0xA08D        # cvVolt
    value_type: U_WORD
    unit_of_measurement: "V"
    entity_category: config
    mode: box
    min_value: 40
