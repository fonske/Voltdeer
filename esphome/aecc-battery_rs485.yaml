substitutions:
  name: aecc-battery    
  friendly_name: aecc-battery  

  ## ---- Power control via the battery's own WiFi module (JSON API, TCP 8080) ----
  aecc_ip: "192.168.0.132"     # <-- IP address of the battery's WiFi module (give it a DHCP reservation)
  aecc_port: "8080"
  ems_slot_min_interval: "10"   # s, minimum time between JSON updates of schedule slot 3003 (the battery's fallback command)
  ems_min_soc: "15"             # %, default of "Discharge Limit" (no discharging at or below this SOC)
  ems_max_soc: "100"            # %, default of "Charge Limit" (no charging at or above this SOC)
  ems_max_charge: "2400"        # W, hardware maximum charge power: upper end of "Max Charge Power" and its default
  ems_max_discharge: "2400"     # W, hardware maximum discharge power: upper end of "Max Discharge Power" and its default

## Version 1.0 - AECC battery over RS485 (Modbus) with local power control via the JSON API (port 8080)
##               Register map: makstech/esphome-aecc; work modes and names: StekkerDeal/aecc-battery-local
#

esphome:
  name: ${name}
  # friendly_name: ${friendly_name}  ### temporarely uncommented because of sensor naming wrong
  min_version: 2026.9.0   # needed for modbus turnaround_time
  name_add_mac_suffix: false
  includes:                # needed for the JSON API client (TCP sockets + background task)
    - <sys/socket.h>
    - <netinet/in.h>
    - <arpa/inet.h>
    - <fcntl.h>
    - <unistd.h>
    - <cerrno>
    - <atomic>
    - <string>
    - <freertos/FreeRTOS.h>
    - <freertos/task.h>
  on_boot:
    priority: -200
    then:
      - delay: 20s
      - if:
          condition:
            select.is:
              id: working_mode
              options: "Custom / Manual"
          then:
            - script.execute: ems_take_control

esp32:
  board: esp32-s3-devkitc-1  ## M5stack Atom S3 lite  
  flash_size: 8MB
  variant: esp32s3
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    ## Custom sdkconfig options
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y   # needs the CONFIG_ prefix, otherwise ignored
      CONFIG_BT_ENABLED: n

## Enable/Disable logging
logger:
  logs:
    component: ERROR
    modbus.number: WARN    # the setpoint writer logs every 1 s write at DEBUG
  
## Enable Home Assistant API
api:
  reboot_timeout: 0s
#  encryption:
#    key: !secret aecc_battery_api_encryption_key

## Enable OTA updates
ota:
  - platform: esphome
  - platform: web_server
#  password: !secret aecc_battery_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  fast_connect: true
  power_save_mode: none   # "high" adds latency and dropouts; the ESP is mains-powered anyway

## uncomment if you need a fixed ip address
#  manual_ip:
#    static_ip: 192.168.178.126
#    gateway: 192.168.178.1
#    subnet: 255.255.255.0

## Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Hotspot"
    password: "configesp"
    ap_timeout: 15s

captive_portal:
  id: id_captive_portal
  
web_server:
  port: 80
  version: 3
  include_internal: False
#  ota: False
  local: True
  sorting_groups:
    - id: Info
      name: "Info"
      sorting_weight: -40
    - id: Control
      name: "Control"
      sorting_weight: -30
    - id: Status
      name: "Status"
      sorting_weight: -20
    - id: Settings
      name: "Settings"
      sorting_weight: -15
    - id: Advanced
      name: "Advanced (careful!)"
      sorting_weight: -12
    - id: Diagnostic
      name: "Diagnostic"
      sorting_weight: -10

## Configure i2c (grove port on Atom S3)
i2c:
  - id: bus_a
    sda: GPIO2
    scl: GPIO1

## Configure UART
uart:
  - id: mod_bus
    tx_pin: GPIO6
    rx_pin: GPIO5
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: NONE

modbus:
  - uart_id: mod_bus
    id: modbus1
    send_wait_time: 350ms   # how long to wait for a reply; same reply window as makstech/esphome-aecc
                            # (was 20 ms: too short, the inverter often answers later -> lost frames/writes)
    turnaround_time: 15ms   # AECC needs >= 12 ms between frames; default (600 ms) is needlessly slow

modbus_controller:
  - id: mt
    address: 0x1
    modbus_id: modbus1
    update_interval: 5s     # live telemetry

  ## Same inverter, polled less often (replaces skip_updates, which ESPHome 2026.x ignores)
  - id: mt_30s
    address: 0x1
    modbus_id: modbus1
    update_interval: 30s     # temperatures

  - id: mt_slow
    address: 0x1
    modbus_id: modbus1
    update_interval: 600s    # settings (numbers / selects / switches); ~25 reads in one burst, so keep it rare

# Uart logging on/off switch
switch:
  - platform: template
    name: UART Logging
    id: uart_debug_switch
    icon: mdi:text
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - logger.set_level: VERBOSE
    turn_off_action:
      - logger.set_level: ERROR
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 20
      
###############################################################################
## POWER CONTROL
## How it works (from makstech/esphome-aecc docs/PROTOCOL.md):
##  1. The energy manager (JSON API on ${aecc_ip}:${aecc_port}, NOT on Modbus) must be enabled,
##     in custom mode, with schedule slot 3003 running a command. The slot holds the target itself.
##  2. 0xFE16 (Modbus) is written every second for a fast response; when a write is missed
##     the battery falls back to the slot, which equals the target, so nothing changes.
##  3. The vendor app's AI mode rewrites the energy manager settings, so they are reasserted
##     every 5 minutes while Work Mode is "Custom / Manual".
## Work Mode (dropdown, Control group), same modes and registers as StekkerDeal/aecc-battery-local:
##   Self-Consumption (AI): 3000=1, 3020=3, 3021=1, 3022=1, 3030=0, slot 3003 cleared -> battery's own AI
##   Custom / Manual:       3000=1, 3020=6, 3021=0, 3022=0, 3030=1, slot 3003 = target power,
##                          3039 = max(Max Charge Power, Max Discharge Power) (local TCP control is capped
##                          at 800 W unless 3039 is raised)
##   Both:                  3023 = Discharge Limit, 3024 = Charge Limit (the slot carries them as well)
##                          -> Power Setpoint is written to 0xFE16 every second
## The JSON API serves ONE client at a time: close the vendor app / disable any HA integration
## that talks to the battery on port 8080, otherwise requests here get no reply.
###############################################################################
## AECC on/off settings (0 = off, 1 = on)
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Energy Saving Mode"
    id: eco_mode
    icon: mdi:leaf
    register_type: holding
    address: 0xA02D        # ecoEn
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Settings
      sorting_weight: 31

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Buzzer Mute"
    id: buzzer_mute
    icon: mdi:volume-off
    register_type: holding
    address: 0xA033        # muteEn
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Settings
      sorting_weight: 32

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Battery Activation"
    id: battery_activation
    icon: mdi:battery-sync
    register_type: holding
    address: 0xA03E        # battActiveSet
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 33

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Mixing Priority"
    id: mixing_priority
    icon: mdi:call-merge
    register_type: holding
    address: 0xA041        # hybirdPriorityEn
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Settings
      sorting_weight: 34

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "External CT From EMS Host"
    id: external_ct_host
    icon: mdi:meter-electric
    register_type: holding
    address: 0xA047        # extCtGetHostEn
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 35

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Independent Pack"
    id: independent_pack
    icon: mdi:battery-plus-variant
    register_type: holding
    address: 0xA0AF        # battPackNotUnion
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 36

  ## SAFETY: off stops the unit disconnecting from a dead grid
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Anti Islanding"
    id: anti_islanding
    icon: mdi:shield-alert
    register_type: holding
    address: 0xA069        # islandEn
    bitmask: 1
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 37

  ## off drops the RS485 BMS link to the pack
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "BMS Function"
    id: bms_function
    icon: mdi:battery-heart-variant
    register_type: holding
    address: 0xA099        # bmsSet
    bitmask: 1
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 38

  ## switches the whole inverter off
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Device Power"
    id: device_power
    icon: mdi:power
    register_type: holding
    address: 0x9C40        # onOffCtrl
    bitmask: 1
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: Control
      sorting_weight: 39

# Tekstsensoren
# "Device Name" (register 31000) removed: that is a Marstek Venus register. It does not
# exist on the AECC inverter, and repeated reads of invalid addresses can make the
# inverter stop answering Modbus altogether.
button:
  - platform: template
    name: "Read EMS Config"
    id: ems_read_config
    icon: mdi:download-network
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: ems_send
          body: '"Get":"Energycontrolparameters","RegControlAddr":[3000,3003,3020,3021,3022,3026,3029,3030,3039]'
    web_server:
      sorting_group_id: Control
      sorting_weight: 3

text_sensor:
  - platform: template
    name: "EMS Reply"
    id: ems_reply_text
    icon: mdi:code-json
    entity_category: diagnostic
    update_interval: never   # last reply from the battery's JSON API (truncated to 250 chars)
    web_server:
      sorting_group_id: Control
      sorting_weight: 4

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: mt
    name: "Fault"
    id: fault
    device_class: problem
    register_type: holding
    address: 0xFE0F        # 65039, device status: 0 normal, 1 fault (StekkerDeal)
    bitmask: 0xFFFF        # any non-zero value = fault
    web_server:
      sorting_group_id: Status
      sorting_weight: 0

sensor:
  - name: "Atom temperature"
    id: atom_temperature
    icon: mdi:thermometer
    platform: internal_temperature
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 14


  - platform: wifi_signal
    name: "ESP WiFi Signal Strength"
    id: esp_wifi_signal_strength
    icon: mdi:wifi
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 5

  - platform: copy
    name: "ESP WiFi Signal Percentage"
    id: esp_wifi_signal_proc
    source_id: esp_wifi_signal_strength
    icon: mdi:wifi
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 4

## Live telemetry, 65030-65046 (0xFE06-0xFE16). Read in one block by modbus_controller.

  - name: "Battery SOC"
    id: battery_state_of_charge
    icon: mdi:power-plug-battery-outline
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE06        # 65030
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0   # whole percent
    web_server:
      sorting_group_id: Info
      sorting_weight: 6

  - name: "Battery Power"
    id: battery_power
    icon: mdi:flash
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE07        # 65031, register: + = discharging; shown as + = charging (StekkerDeal)
    value_type: S_WORD
    filters:
      - multiply: -1
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 7

  - name: "Battery Charging Power"
    id: battery_charge_power
    platform: copy
    source_id: battery_power
    icon: mdi:battery-arrow-up
    filters:
      - lambda: "return x > 0 ? x : 0;"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 8

  - name: "Battery Discharging Power"
    id: battery_discharge_power
    platform: copy
    source_id: battery_power
    icon: mdi:battery-arrow-down
    filters:
      - lambda: "return x < 0 ? -x : 0;"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 9

  - name: "AC Charging Power"
    id: losses_power
    icon: mdi:transmission-tower-import
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE08        # 65032, standby + conversion loss / power drawn from AC to charge
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 10

  - name: "Grid Power"
    id: grid_power
    icon: mdi:transmission-tower
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE0A        # 65034, at the inverter's own port, + = exporting
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 11

  - name: "Backup Power"
    id: backup_load
    icon: mdi:power-socket-eu
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE10        # 65040
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 12

  - name: "Active Power Setpoint"
    id: power_setpoint
    icon: mdi:target
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE16        # 65046, register: + = discharging; shown as + = charging
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: -1
    ## Watchdog (Custom / Manual only): if 0xFE16 reads something other than the target
    ## (non-zero) for 2 readings in a row (~10 s), re-send the energy manager setup (max once per minute).
    on_value:
      - lambda: |-
          if (id(working_mode).active_index().value_or(0) != 1) { id(setpoint_fallbacks) = 0; return; }   // not Custom / Manual
          if (std::isnan(x)) return;
          float reg = -x;                        // back to register convention (+ = discharge)
          float target = id(desired_power);      // register convention
          // ignore the first seconds after a target change (write + read may cross)
          if (millis() - id(desired_since_ms) < 6000) { id(setpoint_fallbacks) = 0; return; }
          bool fallback = lroundf(reg) != id(desired_power) && id(desired_power) != 0;
          if (!fallback) { id(setpoint_fallbacks) = 0; return; }
          id(setpoint_fallbacks) += 1;
          id(setpoint_fallback_total).publish_state(
              (std::isnan(id(setpoint_fallback_total).state) ? 0 : id(setpoint_fallback_total).state) + 1);
          ESP_LOGW("ems", "setpoint reads %.0f W instead of %.0f W (+ = charge), %d in a row",
                   x, -target, id(setpoint_fallbacks));
          if (id(setpoint_fallbacks) >= 2 && millis() - id(last_takeover_ms) > 60000) {
            id(last_takeover_ms) = millis();
            id(setpoint_fallbacks) = 0;
            ESP_LOGW("ems", "re-sending energy manager setup");
            id(slot_power_sent) = 99999;
            id(ems_take_control).execute();
          }
    web_server:
      sorting_group_id: Info
      sorting_weight: 13

  - name: "Available Charge Power"
    id: available_charge_power
    icon: mdi:battery-arrow-up-outline
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE09        # 65033
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 15

  - name: "Nominal Power"
    id: nominal_power
    icon: mdi:gauge
    platform: modbus_controller
    modbus_controller_id: mt_slow
    register_type: holding
    address: 0xFE0B        # 65035
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 30

  - name: "Nominal Battery Power"
    id: nominal_battery_power
    icon: mdi:gauge
    platform: modbus_controller
    modbus_controller_id: mt_slow
    register_type: holding
    address: 0xFE0D        # 65037
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 31

  - name: "Alarm Flags"
    id: alarm_flags
    icon: mdi:alert-circle-outline
    platform: modbus_controller
    modbus_controller_id: mt_30s
    register_type: holding
    address: 0xFE1B        # 65051-65052, 32-bit, low word first; bit meanings unknown
    value_type: U_DWORD_R
    accuracy_decimals: 0
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 32

## Lifetime energy counters, 52050-52053 and 52080-52081: 32-bit, low word first, 0.1 kWh
## (StekkerDeal/aecc-battery-local). Counted at the battery, behind the inverter. Read every 10 min.
## Not confirmed on RS485: if the log shows Modbus errors for these addresses, remove them.
  - name: "Lifetime Energy Charged"
    id: lifetime_energy_charged
    icon: mdi:battery-charging
    platform: modbus_controller
    modbus_controller_id: mt_slow
    register_type: holding
    address: 52050
    value_type: U_DWORD_R
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    on_value:
      - component.update: lifetime_rte
    web_server:
      sorting_group_id: Info
      sorting_weight: 20

  - name: "Lifetime Energy Discharged"
    id: lifetime_energy_discharged
    icon: mdi:battery-arrow-down-outline
    platform: modbus_controller
    modbus_controller_id: mt_slow
    register_type: holding
    address: 52052
    value_type: U_DWORD_R
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    on_value:
      - component.update: lifetime_rte
    web_server:
      sorting_group_id: Info
      sorting_weight: 21

  ## Round-trip efficiency = Lifetime Energy Discharged / Lifetime Energy Charged x 100.
  ## NaN (unknown) while either counter is unknown or nothing has been charged yet.
  ## Recalculated whenever one of the two counters gets a new value.
  - platform: template
    name: "Lifetime RTE"
    id: lifetime_rte
    icon: mdi:battery-sync
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      float charged = id(lifetime_energy_charged).state;
      float discharged = id(lifetime_energy_discharged).state;
      if (std::isnan(charged) || std::isnan(discharged) || charged <= 0.0f) return NAN;
      return discharged / charged * 100.0f;
    web_server:
      sorting_group_id: Info
      sorting_weight: 23

  - name: "Lifetime Energy to Grid"
    id: lifetime_energy_to_grid
    icon: mdi:transmission-tower-export
    platform: modbus_controller
    modbus_controller_id: mt_slow
    register_type: holding
    address: 52080
    value_type: U_DWORD_R
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    web_server:
      sorting_group_id: Info
      sorting_weight: 22

  - name: "PV Power"
    id: pv_power
    icon: mdi:solar-power
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE1F        # 65055, AC-coupled PV port; raw value is negative while producing
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: -1       # shown positive while producing
    web_server:
      sorting_group_id: Info
      sorting_weight: 14


  - platform: template
    name: "EMS Errors"
    id: ems_errors
    icon: mdi:alert-circle-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never     # JSON requests that failed after 3 attempts (since boot)
    web_server:
      sorting_group_id: Control
      sorting_weight: 5

  - platform: template
    name: "Setpoint Fallbacks"
    id: setpoint_fallback_total
    icon: mdi:backup-restore
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never     # readings where 0xFE16 did not hold the target
    web_server:
      sorting_group_id: Control
      sorting_weight: 6

## Temperatures, 30073-30075 (0x7579-0x757B), signed, 0.1 °C. Labels as in the vendor app /
## StekkerDeal: the app numbers the first two the other way round from the registers.
## Source: Lunergy Modbus TCP handleiding. Read as one 3-register block every 30 s (mt_30s).
  - name: "PV Radiator Temperature"
    id: temperature_1
    icon: mdi:thermometer
    platform: modbus_controller
    modbus_controller_id: mt_30s
    register_type: holding
    address: 30073         # 0x7579
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    web_server:
