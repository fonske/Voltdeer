substitutions:
  name: aecc-battery    ## change name to marstek-m2 or marstek-m3 for more batterys
  friendly_name: aecc-battery  ## change name to Marstek m2 or Marstek m3 for more batterys

## Version 1.0 - Added full AECC register map from github.com/makstech/esphome-aecc
##                (docs/REGISTERS.md + components/aecc/registers.h)
#
# AECC Modbus quirks (from makstech/esphome-aecc docs/PROTOCOL.md):
#   - slave 1, 9600 8N1, only function codes 3 (read) and 6 (write single) exist
#   - max 32 registers per read, leave >= 12 ms between frames
#   - NEVER probe unknown addresses: a run of illegal-address reads can hang the inverter.
#     Known-valid islands: 0x9AC0-0x9B13, 0x9C40-0x9C4B, 0xA028-0xA0F9, plus telemetry 0xFE06-0xFE1F
#   - settings verified on a Humsienk HSBPSS2K5W7K68WHEU; enum values/defaults can differ
#     on other builds, so read a value back before trusting it.
#

esphome:
  name: ${name}
  # friendly_name: ${friendly_name}  ### temporarely uncommented because of sensor naming wrong for nodered flow gitcode bob
  min_version: 2026.9.0   # needed for modbus turnaround_time
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1  ## M5stack Atom S3 lite  
  flash_size: 8MB
  variant: esp32s3
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    ## Custom sdkconfig options
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y   # needs the CONFIG_ prefix, otherwise ignored
      CONFIG_BT_ENABLED: n

## No psram: block - the AtomS3 Lite (ESP32-S3FN8) has no PSRAM.

## Enable/Disable logging
logger:
  logs:
    component: ERROR
  
## Enable Home Assistant API
api:
  reboot_timeout: 0s
#  encryption:
#    key: !secret marstek_m1_api_encryption_key

## Enable OTA updates
ota:
  - platform: esphome
  - platform: web_server
#  password: !secret marstek_m1_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  fast_connect: true
  power_save_mode: none   # "high" adds latency and dropouts; the ESP is mains-powered anyway

## uncomment if you need a fixed ip address
#  manual_ip:
#    static_ip: 192.168.178.126
#    gateway: 192.168.178.1
#    subnet: 255.255.255.0

## Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Hotspot"
    password: "configesp"
    ap_timeout: 15s

captive_portal:
  id: id_captive_portal
  
web_server:
  port: 80
  version: 3
  include_internal: False
#  ota: False
  local: True
  sorting_groups:
    - id: Info
      name: "Info"
      sorting_weight: -40
    - id: Control
      name: "Control"
      sorting_weight: -30
    - id: Status
      name: "Status"
      sorting_weight: -20
    - id: Settings
      name: "Settings"
      sorting_weight: -15
    - id: Advanced
      name: "Advanced (careful!)"
      sorting_weight: -12
    - id: Diagnostic
      name: "Diagnostic"
      sorting_weight: -10

## Configure i2c (grove port on Atom S3)
i2c:
  - id: bus_a
    sda: GPIO2
    scl: GPIO1

## Configure UART
uart:
  - id: mod_bus
    tx_pin: GPIO6
    rx_pin: GPIO5
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: NONE

modbus:
  - uart_id: mod_bus
    id: modbus1
    send_wait_time: 20ms
    turnaround_time: 15ms   # AECC needs >= 12 ms between frames; default (600 ms) is needlessly slow

modbus_controller:
  - id: mt
    address: 0x1
    modbus_id: modbus1
    update_interval: 5s     # live telemetry

  ## Same inverter, polled less often (replaces skip_updates, which ESPHome 2026.x ignores)
  - id: mt_30s
    address: 0x1
    modbus_id: modbus1
    update_interval: 30s     # temperatures

  - id: mt_slow
    address: 0x1
    modbus_id: modbus1
    update_interval: 300s    # settings (numbers / selects / switches)

# Uart logging on/off switch
switch:
  - platform: template
    name: UART Logging
    id: uart_debug_switch
    icon: mdi:text
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - logger.set_level: VERBOSE
    turn_off_action:
      - logger.set_level: ERROR
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 20
      
## AECC on/off settings (0 = off, 1 = on)
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Energy Saving Mode"
    id: eco_mode
    icon: mdi:leaf
    register_type: holding
    address: 0xA02D        # ecoEn
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Settings
      sorting_weight: 31

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Buzzer Mute"
    id: buzzer_mute
    icon: mdi:volume-off
    register_type: holding
    address: 0xA033        # muteEn
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Settings
      sorting_weight: 32

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Battery Activation"
    id: battery_activation
    icon: mdi:battery-sync
    register_type: holding
    address: 0xA03E        # battActiveSet
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 33

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Mixing Priority"
    id: mixing_priority
    icon: mdi:call-merge
    register_type: holding
    address: 0xA041        # hybirdPriorityEn
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Settings
      sorting_weight: 34

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "External CT From EMS Host"
    id: external_ct_host
    icon: mdi:meter-electric
    register_type: holding
    address: 0xA047        # extCtGetHostEn
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 35

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Independent Pack"
    id: independent_pack
    icon: mdi:battery-plus-variant
    register_type: holding
    address: 0xA0AF        # battPackNotUnion
    bitmask: 1
    entity_category: config
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 36

  ## SAFETY: off stops the unit disconnecting from a dead grid
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Anti Islanding"
    id: anti_islanding
    icon: mdi:shield-alert
    register_type: holding
    address: 0xA069        # islandEn
    bitmask: 1
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 37

  ## off drops the RS485 BMS link to the pack
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "BMS Function"
    id: bms_function
    icon: mdi:battery-heart-variant
    register_type: holding
    address: 0xA099        # bmsSet
    bitmask: 1
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 38

  ## switches the whole inverter off
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Device Power"
    id: device_power
    icon: mdi:power
    register_type: holding
    address: 0x9C40        # onOffCtrl
    bitmask: 1
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: Control
      sorting_weight: 39

# Tekstsensoren
# "Device Name" (register 31000) removed: that is a Marstek Venus register. It does not
# exist on the AECC inverter, and repeated reads of invalid addresses can make the
# inverter stop answering Modbus altogether.
text_sensor:
  - platform: template
    name: "Device Status"
    id: device_status
    icon: mdi:list-status
    update_interval: never   # filled by "Device Status Code" (register 65039)
    web_server:
      sorting_group_id: Status
      sorting_weight: 0

sensor:
  - name: "Atom temperature"
    id: atom_temperature
    icon: mdi:thermometer
    platform: internal_temperature
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 14


  - platform: wifi_signal
    name: "ESP WiFi Signal Strength"
    id: esp_wifi_signal_strength
    icon: mdi:wifi
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 5

  - platform: copy
    name: "ESP WiFi Signal Percentage"
    id: esp_wifi_signal_proc
    source_id: esp_wifi_signal_strength
    icon: mdi:wifi
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic
    web_server:
      sorting_group_id: Diagnostic
      sorting_weight: 4

## Live telemetry, 65030-65046 (0xFE06-0xFE16). Read in one block by modbus_controller.

  - name: "Battery State Of Charge"
    id: battery_state_of_charge
    icon: mdi:power-plug-battery-outline
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE06        # 65030
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0   # whole percent
    web_server:
      sorting_group_id: Info
      sorting_weight: 6

  - name: "Battery Power"
    id: battery_power
    icon: mdi:flash
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE07        # 65031, + = discharging, - = charging
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 7

  - name: "Battery Charge Power"
    id: battery_charge_power
    platform: copy
    source_id: battery_power
    icon: mdi:battery-arrow-up
    filters:
      - lambda: "return x < 0 ? -x : 0;"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 8

  - name: "Battery Discharge Power"
    id: battery_discharge_power
    platform: copy
    source_id: battery_power
    icon: mdi:battery-arrow-down
    filters:
      - lambda: "return x > 0 ? x : 0;"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 9

  - name: "AC Charge Or Losses Power"
    id: losses_power
    icon: mdi:transmission-tower-import
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE08        # 65032, standby + conversion loss / power drawn from AC to charge
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 10

  - name: "Grid Power"
    id: grid_power
    icon: mdi:transmission-tower
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE0A        # 65034, at the inverter's own port, + = exporting
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 11

  - name: "Backup (EPS) Load"
    id: backup_load
    icon: mdi:power-socket-eu
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE10        # 65040
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 12

  - name: "Active Power Setpoint"
    id: power_setpoint
    icon: mdi:target
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE16        # 65046, + = discharging, - = charging
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: Info
      sorting_weight: 13

  - name: "PV Power"
    id: pv_power
    icon: mdi:solar-power
    platform: modbus_controller
    modbus_controller_id: mt
    register_type: holding
    address: 0xFE1F        # 65055, AC-coupled PV port; raw value is negative while producing
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: -1       # shown positive while producing
    web_server:
      sorting_group_id: Info
      sorting_weight: 14


## Temperatures, 30073-30075 (0x7579-0x757B), signed, 0.1 °C.
## Source: Lunergy Modbus TCP handleiding. Read as one 3-register block every 30 s (mt_30s).
  - name: "Inverter Temperature"
    id: temperature_1
    icon: mdi:thermometer
    platform: modbus_controller
    modbus_controller_id: mt_30s
    register_type: holding
    address: 30073         # 0x7579
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    web_server:
      sorting_group_id: Status
      sorting_weight: 1

  - name: "Radiator Temperature"
    id: temperature_2
    icon: mdi:thermometer
    platform: modbus_controller
    modbus_controller_id: mt_30s
    register_type: holding
    address: 30074         # 0x757A
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    web_server:
      sorting_group_id: Status
      sorting_weight: 2

  - name: "Transformer Temperature"
    id: temperature_3
    icon: mdi:thermometer
    platform: modbus_controller
    modbus_controller_id: mt_slow
    register_type: holding
    address: 30075         # 0x757B
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    web_server:
      sorting_group_id: Status
      sorting_weight: 3


###############################################################################
## AECC SETTINGS (registers 0xA028-0xA0AF, 0x9C40, 0x9ACE)
## Polled every 5 minutes via modbus_controller mt_slow. Only FC6 single-register writes are used.
## Entities marked disabled_by_default can break things: enable them in HA only if you know why.
###############################################################################
number:
## Battery power setpoint 0xFE16 (signed, - = charge, + = discharge).
## Only honoured while the energy manager (JSON API on TCP 8080, NOT Modbus) is already running
## a non-zero command with custom mode (EMS 3030) on. Otherwise the write is accepted and reverts
## within ~1.5 s. The unit also falls back to its schedule slot ~3 s after you stop writing, so
## it must be re-written continuously (e.g. every 2 s from Home Assistant).
  - platform: modbus_controller
    modbus_controller_id: mt
    name: "Power Setpoint"
    id: power_setpoint_number
    icon: mdi:target
    register_type: holding
    address: 0xFE16
    value_type: S_WORD
    unit_of_measurement: "W"
    mode: box
    min_value: -2500
    max_value: 2500
    step: 1
    web_server:
      sorting_group_id: Control
      sorting_weight: 1

## Grid-tie (on-grid output) power cap. Lives in THREE places: 0xA03F, mirror 0x9ACE and EMS 3039
## (JSON API only). Output tops out at the lowest of them. This writes both Modbus copies.
## Note: it caps total on-grid output (incl. your own load), so it is not a pure export limit.
  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Grid Tie Power Cap"
    id: grid_export_limit
    icon: mdi:transmission-tower-export
    register_type: holding
    address: 0xA03F        # onGridActivePowerSet
    value_type: U_WORD
    unit_of_measurement: "W"
    entity_category: config
    mode: box
    min_value: 0
    max_value: 2500        # adjust to your unit's rating
    step: 1
    write_lambda: |-
      // also write the mirror copy at 0x9ACE
      auto mirror = modbus_controller::ModbusCommandItem::create_write_single_command(
          id(mt_slow), 0x9ACE, (uint16_t) x);
      id(mt_slow)->queue_command(mirror);
      return x;
    web_server:
      sorting_group_id: Settings
      sorting_weight: 0

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Constant Voltage"
    id: cv_voltage
    icon: mdi:flash
    register_type: holding
    address: 0xA08D        # cvVolt
    value_type: U_WORD
    unit_of_measurement: "V"
    entity_category: config
    mode: box
    min_value: 40
    max_value: 60
    step: 0.1
    multiply: 10
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 1

  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Float Voltage"
    id: float_voltage
    icon: mdi:flash
    register_type: holding
    address: 0xA08E        # floatVolt
    value_type: U_WORD
    unit_of_measurement: "V"
    entity_category: config
    mode: box
    min_value: 40
    max_value: 60
    step: 0.1
    multiply: 10
    web_server:
      sorting_group_id: Advanced
      sorting_weight: 2

  - platform: modbus_controller
