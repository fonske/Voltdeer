  - platform: modbus_controller
    modbus_controller_id: mt_slow
    name: "Max Charge Current"
    id: max_charge_current
    icon: mdi:current-dc
    register_type: holding
    address: 0xA02F        # maxChgCurrSet
    value_type: U_WORD
    unit_of_measurement: "A"
    entity_category: config
    mode: box
    min_value: 0
    max_value: 100
    step: 0.1
    multiply: 10
    web_server:
